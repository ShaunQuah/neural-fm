[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralfm"
version = "0.1.0"
description = "Self-supervised transformer for neural spiking data: masked pretraining and evaluation"
authors = [{ name = "Shaun Quah" }]
requires-python = ">=3.10"
dependencies = ["numpy", "torch>=2.4"]

[project.optional-dependencies]
train = ["scipy", "scikit-learn", "pandas", "pynwb", "mlflow", "accelerate", "nlb_tools"]
serve = ["fastapi", "uvicorn", "pydantic>=2"]
dev = ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
