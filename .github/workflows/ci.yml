name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" scipy scikit-learn
      - name: Install nlb_tools (enables the official-metric cross-check test)
        continue-on-error: true
        run: pip install nlb_tools
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -rs
